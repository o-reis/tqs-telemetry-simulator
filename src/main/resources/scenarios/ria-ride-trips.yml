# Ria Ride trips demo: the same 6 hubs and 20 vehicles as ria-ride.yml, but vehicles leave their hub
# and ride to another one, so they move on a map. A trip goes in a straight line at rideSpeedKmh;
# on arrival the vehicle is locked at the destination hub, at the hub's exact position.
# Run it with SIMULATOR_SCENARIO_FILE=classpath:scenarios/ria-ride-trips.yml
# All names are fictional and the coordinates are approximate.
fleetId: fleet-01

simulation:
  emissionIntervalSeconds: 10   # one reading per vehicle every 10 s
  seed: 42                      # the same seed gives the same run
  faultProbability: 0.01        # chance of a fault per reading; a faulty vehicle does not leave
  drainPercentPerMinute: 0.5    # battery lost per minute while riding
  chargePercentPerMinute: 0.5   # battery gained per minute while parked at a hub
  tripProbability: 0.05         # chance per reading that a parked vehicle leaves: the first one
                                # leaves within seconds and reaches another hub in about 2 min
  rideSpeedKmh: 15              # a relaxed ride: the hubs are 0.2 to 1.9 km apart (1 to 8 min)

hubs:
  - id: hub-01
    name: Estação de Aveiro
    position: { lat: 40.6443, lon: -8.6455 }
  - id: hub-02
    name: Fórum Aveiro
    position: { lat: 40.6412, lon: -8.6501 }
  - id: hub-03
    name: Canal Central
    position: { lat: 40.6405, lon: -8.6538 }
  - id: hub-04
    name: Universidade
    position: { lat: 40.6304, lon: -8.6577 }
  - id: hub-05
    name: Hotel Ria Azul
    position: { lat: 40.6421, lon: -8.6524 }
  - id: hub-06
    name: Hotel Laguna
    position: { lat: 40.6385, lon: -8.6489 }

# Hotel hubs hold more vehicles: that is where visitors start.
vehicles:
  # hub-05 Hotel Ria Azul
  - { id: bike-0001,    type: E_BIKE,    hub: hub-05, battery: 92 }
  - { id: bike-0002,    type: E_BIKE,    hub: hub-05, battery: 88 }
  - { id: scooter-0001, type: E_SCOOTER, hub: hub-05, battery: 75 }
  - { id: bike-0003,    type: E_BIKE,    hub: hub-05, battery: 64 }
  # hub-06 Hotel Laguna
  - { id: bike-0004,    type: E_BIKE,    hub: hub-06, battery: 95 }
  - { id: bike-0005,    type: E_BIKE,    hub: hub-06, battery: 81 }
  - { id: scooter-0002, type: E_SCOOTER, hub: hub-06, battery: 70 }
  - { id: scooter-0003, type: E_SCOOTER, hub: hub-06, battery: 21 }
  # hub-01 Estação de Aveiro
  - { id: bike-0006,    type: E_BIKE,    hub: hub-01, battery: 100 }
  - { id: scooter-0004, type: E_SCOOTER, hub: hub-01, battery: 20 }
  - { id: bike-0007,    type: E_BIKE,    hub: hub-01, battery: 55 }
  # hub-02 Fórum Aveiro
  - { id: bike-0008,    type: E_BIKE,    hub: hub-02, battery: 78 }
  - { id: scooter-0005, type: E_SCOOTER, hub: hub-02, battery: 19 }
  - { id: scooter-0006, type: E_SCOOTER, hub: hub-02, battery: 12 }
  # hub-03 Canal Central
  - { id: bike-0009,    type: E_BIKE,    hub: hub-03, battery: 90 }
  - { id: bike-0010,    type: E_BIKE,    hub: hub-03, battery: 47 }
  - { id: scooter-0007, type: E_SCOOTER, hub: hub-03, battery: 33 }
  # hub-04 Universidade
  - { id: bike-0011,    type: E_BIKE,    hub: hub-04, battery: 85 }
  - { id: bike-0012,    type: E_BIKE,    hub: hub-04, battery: 60 }
  - { id: scooter-0008, type: E_SCOOTER, hub: hub-04, battery: 5 }
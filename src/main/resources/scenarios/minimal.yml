# Smallest valid scenario: one hub and one vehicle. Useful for quick local runs and tests.
fleetId: fleet-01

simulation:
  emissionIntervalSeconds: 10
  seed: 1
  faultProbability: 0

hubs:
  - id: hub-01
    name: Estação de Aveiro
    position: { lat: 40.6443, lon: -8.6455 }

vehicles:
  - { id: bike-0001, type: E_BIKE, hub: hub-01, battery: 90 }
name: Question
description: Ask how to run, configure or integrate with the simulator.
title: "[question] "
labels: [question]
body:
  - type: input
    id: team
    attributes:
      label: Your team
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Simulator version
      description: The image tag you run, if you already run it.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you want to do and what you tried.
    validations:
      required: true

# Build and test on every push and pull request; publish the image from main and from release tags.
# Same level as the platform's backend CI: build, unit and integration tests, coverage check,
# formatting check, mutation testing (pull requests) and SonarCloud with the quality gate.
# A tag vMAJOR.MINOR.PATCH is a simulator release (README, section Releases): it publishes the
# versioned image and creates the GitHub release with its CHANGELOG.md entry.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The interface contract: every valid example must pass its JSON Schema, every invalid one must fail.
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Validate schemas and examples
        run: |
          npm ci
          npm run validate

  # Every telemetry message the simulator emits must follow contract/schemas (tests tagged contract).
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Contract tests
        run: ./mvnw -B test -Pcontract

  simulator:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud needs the full history to find new code and blame

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A release must carry the version in pom.xml and have its changelog entry, checked before
      # anything is built, so a wrong tag never publishes an image.
      - name: Check the release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          pom_version="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$version" != "$pom_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pom.xml ($pom_version)"
            exit 1
          fi
          .github/scripts/release-notes.sh "$version" > /dev/null

      # verify runs the unit and integration tests, the JaCoCo check and the Spotless check
      - name: Build and test
        run: ./mvnw -B verify

      # Mutation testing is slow, so it runs on pull requests only (and on request with -Pmutation)
      - name: Mutation testing
        if: github.event_name == 'pull_request'
        run: ./mvnw -B test-compile pitest:mutationCoverage

      - name: SonarCloud token missing
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not available (secret missing or pull request from a fork), SonarCloud analysis skipped"

      # Reads the JaCoCo report written by verify. Fails the build when the quality gate fails.
      - name: SonarCloud analysis and quality gate
        if: >-
          env.SONAR_TOKEN != '' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true

  # Builds the image on every run; pushes it to GitHub Container Registry only from main and from
  # release tags.
  image:
    needs: [contract, contract-tests, simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: >-
        ${{ github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: latest and the commit SHA on main; on a release tag v1.2.3, 1.2.3, 1.2, the SHA and
      # latest (added for semver tags by the action's default latest=auto, not for pre-releases);
      # the branch name elsewhere (built, not pushed).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a release tag, after the image is published: the GitHub release, with the changelog entry.
  release:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Simulator $GITHUB_REF_NAME" \
            --notes-file release-notes.md

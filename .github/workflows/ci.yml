# Build and test on every push and pull request; publish the image from main.
# A part that has no code yet is skipped with a notice, so a green run says nothing about it.
# Not here yet: build, tests, coverage, mutation testing and SonarCloud of the simulator
# (added with the simulator code, once its stack is chosen).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The interface contract: every valid example must pass its JSON Schema, every invalid one must fail.
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Validate schemas and examples
        run: |
          npm ci
          npm run validate

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No simulator yet
        if: hashFiles('Dockerfile') == ''
        run: echo "::notice::No Dockerfile yet, simulator not built or tested"

      # Build, unit and contract tests, coverage, mutation testing and the SonarCloud quality gate
      # are added here with the simulator code, at the same level as the platform's backend CI.

  # Builds the image on every run; pushes it to GitHub Container Registry only from main.
  image:
    needs: [contract, simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: No image yet
        if: hashFiles('Dockerfile') == ''
        run: echo "::notice::No Dockerfile yet, no image built"

      - uses: docker/setup-buildx-action@v4
        if: hashFiles('Dockerfile') != ''

      - uses: docker/login-action@v4
        if: hashFiles('Dockerfile') != '' && env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: latest and the commit SHA on main; the branch name elsewhere (built, not pushed).
      - id: meta
        uses: docker/metadata-action@v6
        if: hashFiles('Dockerfile') != ''
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        if: hashFiles('Dockerfile') != ''
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
